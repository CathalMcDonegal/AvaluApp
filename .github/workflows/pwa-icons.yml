name: Generate PWA PNG icons

on:
  push:
    branches: [main]
    paths:
      - 'assets/icon.svg'
      - '.github/workflows/pwa-icons.yml'

permissions:
  contents: write

jobs:
  icons:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate 192px and 512px PNG icons
        run: |
          mkdir -p assets
          convert -background none -density 384 assets/icon.svg -resize 192x192 assets/icon-192.png
          convert -background none -density 384 assets/icon.svg -resize 512x512 assets/icon-512.png
          file assets/icon-192.png assets/icon-512.png

      - name: Commit generated icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/icon-192.png assets/icon-512.png
          git diff --cached --quiet || git commit -m "Afegir icones PNG 192 i 512 per instal·lació PWA"
          git push
