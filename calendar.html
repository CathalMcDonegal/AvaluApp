<!doctype html>
<html lang="ca">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f172a"><title>AvaluApp · Calendari</title><link rel="manifest" href="./manifest.json"><link rel="icon" href="./assets/icon.svg">
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:linear-gradient(135deg,#e8edf3,#f4f0f8);color:#0f172a}.top{height:72px;background:#111827;color:#fff;display:flex;align-items:center;gap:12px;padding:0 20px;position:sticky;top:0;z-index:5}.top a{color:#fff;text-decoration:none;background:#1e293b;border:1px solid #475569;border-radius:10px;padding:9px 12px}.brand{font-weight:900;font-size:19px}.wrap{width:min(1200px,calc(100% - 28px));margin:auto;padding:28px 0 60px}.hero{background:linear-gradient(135deg,#fff,#f3e8ff);border:1px solid #d8c8ef;border-radius:22px;padding:24px;margin-bottom:18px}.eyebrow{font-size:12px;font-weight:900;letter-spacing:.12em;color:#7c3aed;margin:0 0 7px}.hero h1{margin:0 0 8px;font-size:clamp(28px,5vw,42px)}.muted{color:#64748b}.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:end}.field{display:flex;flex-direction:column;gap:6px;flex:1;min-width:180px}.field label{font-size:12px;font-weight:800;color:#475569}.field input,.field select{border:1px solid #cbd5e1;border-radius:10px;padding:11px;background:#fff;font:inherit}.primary{border:0;border-radius:10px;padding:11px 16px;background:linear-gradient(135deg,#7c3aed,#ec4899);color:#fff;font-weight:900;cursor:pointer}.monthbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:16px 0}.monthbar h2{margin:0;text-transform:capitalize}.nav{border:1px solid #cbd5e1;background:#fff;border-radius:10px;padding:9px 13px;font-weight:800;cursor:pointer}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.dow{text-align:center;font-size:12px;font-weight:900;color:#64748b;padding:8px}.day{min-height:112px;background:#fff;border:1px solid #dbe2ea;border-radius:10px;padding:7px;position:relative}.day.out{opacity:.42}.num{font-weight:900;font-size:13px}.event{display:block;margin-top:5px;border-radius:7px;padding:5px 6px;font-size:11px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:#ede9fe;color:#5b21b6}.event small{display:block;font-weight:600;color:#7c3aed}.list{margin-top:18px;display:grid;gap:9px}.event-card{background:#fff;border:1px solid #dbe2ea;border-radius:12px;padding:12px 14px;display:flex;gap:12px;align-items:center}.event-card .grow{flex:1}.type{font-size:22px}.delete{border:0;background:#fee2e2;color:#991b1b;border-radius:8px;padding:8px;cursor:pointer}@media(max-width:650px){.wrap{padding-top:18px}.day{min-height:82px;padding:5px}.event{font-size:10px}.event small{display:none}.dow{font-size:10px}.top{height:64px}.monthbar h2{font-size:20px}}
</style></head>
<body><header class="top"><a href="./">← AvaluApp</a><div class="brand">📅 Calendari de classes</div></header><main class="wrap"><section class="hero"><p class="eyebrow">ORGANITZACIÓ</p><h1>Calendari</h1><p class="muted">Cada classe té el seu propi calendari. Les dades queden guardades al dispositiu.</p><div class="bar"><div class="field"><label>Classe</label><select id="group"></select></div><div class="field"><label>Data</label><input id="date" type="date"></div><div class="field"><label>Tipus</label><select id="type"><option value="🚌">🚌 Sortida</option><option value="🎓">🎓 Activitat</option><option value="📝">📝 Examen</option><option value="📚">📚 Treball</option><option value="👨‍👩‍👧">👨‍👩‍👧 Tutoria</option><option value="📌">📌 Altres</option></select></div><div class="field"><label>Títol</label><input id="title" placeholder="Ex. Sortida al Museu"></div><button class="primary" id="add">+ Afegir</button></div></section><div class="monthbar"><button class="nav" id="prev">←</button><h2 id="month"></h2><button class="nav" id="next">→</button></div><section class="calendar" id="cal"></section><section class="list" id="list"></section></main>
<script>
const KEY='avaluapp-calendar-v1';let data=JSON.parse(localStorage.getItem(KEY)||'{}'),current=new Date();const esc=v=>String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const groups=()=>{try{const d=JSON.parse(localStorage.getItem('avaluapp-data-v1')||'{}');return (d.courses||[]).flatMap(c=>(c.groups||[]).map(g=>({id:g.id,name:(c.name+' · '+g.name)})))}catch{return[]}};
const gs=groups(),group=document.querySelector('#group');group.innerHTML=gs.map(g=>`<option value="${g.id}">${esc(g.name)}</option>`).join('');const requested=new URLSearchParams(location.search).get('group');if(requested&&gs.some(g=>g.id===requested))group.value=requested;
const pad=n=>String(n).padStart(2,'0'),key=(gid,date)=>gid+'|'+date;
function save(){localStorage.setItem(KEY,JSON.stringify(data))}
function draw(){const gid=group.value;if(!gid)return;const y=current.getFullYear(),m=current.getMonth();document.querySelector('#month').textContent=current.toLocaleDateString('ca-ES',{month:'long',year:'numeric'});const first=new Date(y,m,1),start=(first.getDay()+6)%7,days=new Date(y,m+1,0).getDate(),prevDays=new Date(y,m,0).getDate(),cal=document.querySelector('#cal');let html=['Dl','Dt','Dc','Dj','Dv','Ds','Dg'].map(x=>`<div class="dow">${x}</div>`).join('');for(let i=0;i<42;i++){const day=i-start+1;if(day<1){const d=prevDays+day;html+=`<div class="day out"><span class="num">${d}</span></div>`}else if(day>days){const d=day-days;html+=`<div class="day out"><span class="num">${d}</span></div>`}else{const date=`${y}-${pad(m+1)}-${pad(day)}`,events=data[key(gid,date)]||[];html+=`<div class="day"><span class="num">${day}</span>${events.map(e=>`<div class="event" title="${esc(e.title)}">${e.type} ${esc(e.title)}<small>${esc(e.type==='🚌'?'Sortida':'')}</small></div>`).join('')}</div>`}}cal.innerHTML=html;const items=Object.entries(data).filter(([k])=>k.startsWith(gid+'|')).flatMap(([k,arr])=>arr.map((e,i)=>({date:k.split('|')[1],e,i,k}))).sort((a,b)=>a.date.localeCompare(b.date));document.querySelector('#list').innerHTML=items.length?items.map(x=>`<article class="event-card"><div class="type">${x.e.type}</div><div class="grow"><strong>${esc(x.e.title)}</strong><div class="muted">${new Date(x.date+'T12:00:00').toLocaleDateString('ca-ES',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</div></div><button class="delete" data-k="${esc(x.k)}" data-i="${x.i}">🗑</button></article>`).join(''):'<div class="muted">No hi ha activitats registrades per aquesta classe.</div>';document.querySelectorAll('.delete').forEach(b=>b.onclick=()=>{const arr=data[b.dataset.k]||[];arr.splice(Number(b.dataset.i),1);if(arr.length)data[b.dataset.k]=arr;else delete data[b.dataset.k];save();draw()})}
document.querySelector('#add').onclick=()=>{const gid=group.value,date=document.querySelector('#date').value,title=document.querySelector('#title').value.trim(),type=document.querySelector('#type').value;if(!gid||!date||!title){alert('Indica classe, data i títol.');return}const k=key(gid,date);data[k]=data[k]||[];data[k].push({title,type});save();document.querySelector('#title').value='';current=new Date(date+'T12:00:00');draw()};document.querySelector('#prev').onclick=()=>{current.setMonth(current.getMonth()-1);draw()};document.querySelector('#next').onclick=()=>{current.setMonth(current.getMonth()+1);draw()};group.onchange=draw;document.querySelector('#date').value=new Date().toISOString().slice(0,10);draw();
</script></body></html>
