ript><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><script src="./src/mobile-install-v26.js?v=28"></script><script src="./src/app-settings.js?v=28"></script><script src="./src/class-calendar-links.js"></script><script src="./src/class-dashboard.js"></script><script src="./src/student-profile.js"></script><script src="./src/class-summary.js"></script><script src="./src/class-grid-enhancer.js"></script><script src="./src/class-grid-stats.js"></script><script src="./src/report-enhancer.js"></script><script src="./src/class-reports.js"></script></head><body><div id="app"></div><a class="global-calendar" href="./calendar.html" title="Obrir calendari">📅 <span>Calendari</span></a><div id="install-banner"><p>📲 Instal·la <strong>AvaluApp</strong> a la pantalla d'inici per usar-la com una app.</p><div><button id="btn-do-install">Instal·lar</button><button id="btn-dismiss-install">Ara no</button></div></div><script type="module" src="./src/app.js?v=28"></script><script src="./src/remove-demo.js?v=28"></script><script>if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js?v=28',{scope:'./',updateViaCache:'none'}).then(r=>r.update()).catch(()=>{}));const KEY='avaluapp-profile-v1',read=()=>{try{return JSON.parse(localStorage.getItem(KEY)||'{}')}catch{return {}}},esc=v=>String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));const mount=()=>{const app=document.querySelector('#app');if(!app||document.querySelector('.school-settings')||!app.querySelector('.course-grid'))return;const d=read(),s=document.createElement('section');s.className='school-settings';s.innerHTML=`<div class="school-settings-head"><div class="school-settings-icon">🏫</div><div><h2>Dades del centre</h2><p>Apareixeran en els informes i queden guardades en aquest dispositiu.</p></div></div><div class="school-settings-grid"><label>Nom de l'escola<input id="school-name" value="${esc(d.school||'')}" placeholder="Ex. Escola Sant Jordi"></label><label>Nom del docent<input id="teacher-name" value="${esc(d.teacher||'')}" placeholder="Ex. Marta Puig"></label></div>`;app.querySelector('.hero')?.after(s);const save=()=>localStorage.setItem(KEY,JSON.stringify({school:s.querySelector('#school-name').value.trim(),teacher:s.querySelector('#teacher-name').value.trim()}));s.querySelectorAll('input').forEach(i=>i.addEventListener('input',save))};new MutationObserver(mount).observe(document.body,{childList:true,subtree:true});window.addEventListener('DOMContentLoaded',mount)</script></body></html>
