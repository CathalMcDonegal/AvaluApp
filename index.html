<!doctype html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f172a">
  <meta name="description" content="AvaluApp — gestió i avaluació d'alumnes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>AvaluApp</title>
  <link rel="manifest" href="./manifest.json?v=25">
  <link rel="icon" href="./assets/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./src/student-profile.css">
  <link rel="stylesheet" href="./src/class-summary.css">
  <link rel="stylesheet" href="./src/class-grid-enhancer.css">
  <link rel="stylesheet" href="./src/class-grid-stats.css">
  <style>
    .install-app{display:none!important}
    .school-settings{margin:0 0 26px;background:linear-gradient(135deg,#fff,#f0f9ff);border:1px solid #bae6fd;border-radius:20px;padding:20px;box-shadow:0 8px 24px #0f172a0a}
    .school-settings-head{display:flex;align-items:center;gap:12px;margin-bottom:14px}
    .school-settings-icon{width:44px;height:44px;border-radius:13px;background:#e0f2fe;display:grid;place-items:center;font-size:22px}
    .school-settings h2{margin:0;font-size:18px}.school-settings p{margin:3px 0 0;color:#64748b;font-size:13px}
    .school-settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.school-settings label{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:800;color:#475569}
    .school-settings input{width:100%;padding:11px 12px;border:1px solid #cbd5e1;border-radius:10px;background:#fff;font:inherit;color:#172033}.school-settings input:focus{outline:3px solid #bae6fd;border-color:#38bdf8}
    #install-banner{display:none;position:fixed;left:10px;right:10px;bottom:14px;z-index:10000;background:#111827;color:#fff;border:1px solid #334155;border-radius:16px;padding:14px 16px;box-shadow:0 8px 32px #0009;flex-direction:column;gap:12px;font-family:system-ui,sans-serif}
    #install-banner.show{display:flex}
    #install-banner p{font-size:15px;line-height:1.4;color:#fff;margin:0}
    #install-banner .install-actions{display:flex;gap:10px}
    #install-banner button{flex:1;border:0;border-radius:12px;padding:14px 12px;font-size:16px;font-weight:900;cursor:pointer}
    #btn-do-install{background:#22c55e;color:#052e16}
    #btn-dismiss-install{background:#334155;color:#fff}
  </style>
  <script type="module">import * as docx from 'https://cdn.jsdelivr.net/npm/docx@9.8.1/+esm';window.docx=docx;</script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="./src/mobile-install.js?v=25"></script>
  <script src="./src/class-calendar-links.js"></script><script src="./src/class-dashboard.js"></script><script src="./src/student-profile.js"></script><script src="./src/class-summary.js"></script><script src="./src/class-grid-enhancer.js"></script><script src="./src/class-grid-stats.js"></script><script src="./src/report-enhancer.js"></script><script src="./src/class-reports.js"></script>
</head>
<body>
  <div id="app"></div>
  <a class="global-calendar" href="./calendar.html" title="Obrir calendari">📅 <span>Calendari</span></a>

  <div id="install-banner" role="dialog" aria-label="Instal·lar AvaluApp">
    <p>📲 Instal·la <strong>AvaluApp</strong> a la pantalla d’inici per usar-la com una app.</p>
    <div class="install-actions">
      <button type="button" id="btn-do-install">Instal·lar</button>
      <button type="button" id="btn-dismiss-install">Ara no</button>
    </div>
  </div>

  <script type="module" src="./src/app.js?v=25"></script><script src="./src/remove-demo.js?v=25"></script>
  <script>
  (()=>{
    if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js?v=25',{scope:'./',updateViaCache:'none'}).then(r=>r.update()).catch(err=>console.warn('AvaluApp SW:',err)))}
    const KEY='avaluapp-profile-v1';const read=()=>{try{return JSON.parse(localStorage.getItem(KEY)||'{}')}catch{return {}}};const esc=v=>String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
    const mount=()=>{const app=document.querySelector('#app');if(!app||document.querySelector('.school-settings')||!app.querySelector('.course-grid'))return;const d=read();const s=document.createElement('section');s.className='school-settings';s.innerHTML=`<div class="school-settings-head"><div class="school-settings-icon">🏫</div><div><h2>Dades del centre</h2><p>Apareixeran en els informes i queden guardades en aquest dispositiu.</p></div></div><div class="school-settings-grid"><label>Nom de l'escola<input id="school-name" value="${esc(d.school||'')}" placeholder="Ex. Escola Sant Jordi"></label><label>Nom de la professora<input id="teacher-name" value="${esc(d.teacher||'')}" placeholder="Ex. Marta Puig"></label></div>`;app.querySelector('.hero')?.after(s);const save=()=>localStorage.setItem(KEY,JSON.stringify({school:s.querySelector('#school-name').value.trim(),teacher:s.querySelector('#teacher-name').value.trim()}));s.querySelectorAll('input').forEach(i=>i.addEventListener('input',save));};new MutationObserver(mount).observe(document.body,{childList:true,subtree:true});window.addEventListener('DOMContentLoaded',mount);
  })();
  </script>
</body>
</html>
